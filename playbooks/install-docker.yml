---
- name: Install Docker
  hosts: webservers
  become: true

  tasks:

    - name: Install Docker Package
      package:
        name: docker
        state: present

    - name: Start Docker Service
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to Docker Group
      user:
        name: ec2-user
        groups: docker
        append: true
